# -------------------------------------------- Tier A (added 08-17, pass 2)
- name: Matthew Golden
  pos: WR
  category: situation
  thesis: >-
    GB cleared its WR room (Doubs to NE, Wicks to PHI) and Golden opened the preseason
    starting at X in 2-WR sets with Watson at Z -- Reed only appeared in 3-WR. Bigger
    snap floor than both, cheapest price of the three.
  kill: >-
    LaFleur's target distribution is historically flat; Kraft is off PUP and back as a
    target competitor; Golden missed camp time with a toe issue (returned 8/11).
  sources:
    - https://www.fantasypros.com/2026/08/fantasy-football-20-nfl-preseason-week-1-takeaways-2026/
    - https://www.packers.com/news/matthew-golden-kept-the-big-plays-coming-on-family-night-aug-8-2026

- name: Josh Downs
  pos: WR
  category: situation
  thesis: >-
    Pittman gone from IND, Pierce coming off ankle/heel surgery. Downs was capped at a
    58.7% snap share in 2025 with only 65 boundary routes; the Colts say he moves outside
    into more 2-WR sets. Our scoring pays this twice.
  kill: >-
    Live reporting conflict on Alec Pierce's Week 1 status (DraftSharks 8/15 says out,
    Yahoo 8/16 says on track). Tyler Warren competes for targets. Partially priced already.
  sources:
    - https://www.colts.com/news/josh-downs-wide-receiver-fantasy-football-usage-snap-counts-targets-2026-season
    - https://www.espn.com/nfl/story/_/id/49540063/indianapolis-colts-josh-downs-wide-receiver-outlook

- name: Wan'Dale Robinson
  pos: WR
  category: situation
  thesis: >-
    Signed 4yr/$70M to reunite with Brian Daboll, now TEN's OC; opened preseason in the
    slot with the ones. Led all WRs in slot receiving yards (622) in 2025. Format
    arbitrage -- on no national breakout list.
  kill: >-
    Entirely a QB risk: Cam Ward's preseason debut was bad (5-of-12, 57 yds, grounding).
    Carnell Tate was the No. 4 overall pick and will command volume.
  sources:
    - https://establishtherun.com/fantasy-fallout-wandale-robinson-signs-with-titans/
    - https://www.rotowire.com/football/nfl-depth-charts/tennessee-titans-depth-chart-ten

- name: Rhamondre Stevenson
  pos: RB
  category: role-path
  thesis: >-
    ADP inversion: August reports have Stevenson as NE's lead back while Henderson
    struggles with vision and patience -- yet Henderson goes ~14 picks earlier. McDaniels
    is OC; Stevenson is his only holdover skill player.
  kill: >-
    "Vision and patience" is soft scouting talk and August backfield consensus is often
    wrong by week 4. Henderson is the better receiver. Stevenson has fumbled.
  sources:
    - https://www.draftsharks.com/article/fantasy-football-risers-and-fallers
    - https://www.patspulpit.com/new-england-patriots-training-camp/130511/running-back-preview-2026-rhamondre-stevenson-treveyon-henderson

- name: Tyjae Spears
  pos: RB
  category: role-path
  thesis: >-
    Out-snapped Pollard with the TEN starters in the preseason opener (12-13 vs 9),
    rotating by five-play stints rather than by situation -- a timeshare, not a backup
    role. Pollard costs ~80 picks more.
  kill: >-
    One preseason game is thin. Rookie Singleton is the only back signed past 2026 and
    could make it a three-way split that helps nobody. Spears has real injury history.
  sources:
    - https://www.fantasypros.com/2026/08/fantasy-football-20-nfl-preseason-week-1-takeaways-2026/

- name: Jalen Coker
  pos: WR
  category: role-path
  thesis: >-
    Earned a three-year extension as CAR's WR2 -- a transaction signal, not camp chatter.
    Started in 2-WR sets in the preseason opener while McMillan played mostly slot,
    leaving Coker the boundary.
  kill: >-
    Bryce Young is the market's ~25th QB and Carolina's pass volume may be low. The WR3
    battle behind McMillan suggests an unsettled room.
  sources:
    - https://sports.yahoo.com/articles/2026-fantasy-football-adp-risers-025317131.html

- name: Patrick Mahomes
  pos: QB
  category: post-injury
  thesis: >-
    The one QB discount that is NOT a 1QB-ADP illusion -- it is within-position. Fully
    cleared ~8 months after ACL/LCL surgery, full participant, held out of preseason
    purely as precaution, yet priced around QB13.
  kill: >-
    Whether he takes any preseason week 3 snaps. Verify against our OWN 2QB board before
    calling it value -- national QB "discounts" usually evaporate in our room.
  sources:
    - https://www.nfl.com/news/chiefs-qb-patrick-mahomes-knee-fully-cleared-to-participate-in-training-camp
    - https://www.cbssports.com/fantasy/football/news/chiefs-patrick-mahomes-eyeing-week-1-return-in-2026

# ---------------------------------------------------------------- Tier B
- name: Bhayshul Tuten
  pos: RB
  category: situation
  thesis: >-
    Etienne to NO vacates 296 touches; took every first-team offseason snap; elite
    rookie efficiency (7 TD on 93 touches, 31% missed-tackles-forced, 2nd among RBs).
    Board already has him t1 -- the note is the kill condition.
  kill: >-
    Chris Rodriguez Jr. (2yr/$10M) winning early-down work; LeQuint Allen takes passing
    downs. Beat writers call this a live camp battle -- watch preseason snap counts.
  sources:
    - https://www.espn.com/fantasy/football/story/_/page/FFSleepBustBreak26-49030808/fantasy-football-2026-rankings-nfl-sleepers-breakouts-busts
    - https://www.si.com/fantasy/2026-football-sleepers-breakouts-bargains-all-32-nfl-teams

- name: Cam Skattebo
  pos: RB
  category: post-injury
  thesis: >-
    An RB10-in-PPG rookie stretch (Wks 1-8) buried by a gruesome ankle -- dislocation
    plus fractured fibula plus ruptured deltoid ligament. Took live 11-on-11 offseason
    reps; "Week 1, I'll be ready to go."
  kill: >-
    Anything short of full-contact participation in August. Injury severity is the real
    tail risk at this price, and analysts flag it even while confirming the facts.
  sources:
    - https://sports.yahoo.com/fantasy/article/from-malik-nabers-to-patrick-mahomes-here-are-the-injuries-you-need-to-note-for-2026-fantasy-football-152947326.html

- name: Emeka Egbuka
  pos: WR
  category: year-n-leap
  thesis: >-
    Full-season rookie line masks the split: 20.1 PPG over five healthy games vs 7.8
    after hip/groin/hamstring trouble, with target share holding (23.1%, 28.9%
    first-read) through the fade. Evans' targets vacated on top.
  kill: >-
    Soft-tissue recurrence in camp. Caveat on the thesis: the late-season collapse was
    partly offense-wide efficiency, not purely health.
  sources:
    - https://www.fantasylife.com/articles/fantasy/keeping-tabs-of-injury-recoveries-impacting-fantasy-football

- name: Christian Watson
  pos: WR
  category: situation
  thesis: >-
    Doubs gone and Wicks traded vacate ~131 targets with no competition added; Watson
    held a 34% air-yardage share and was GB's top scoring WR after his 2025 return.
    Weakest thesis here -- verification split 2-1.
  kill: >-
    Reed projects the larger raw target share and Kraft competes for red-zone work.
    ADP climbing 80s -> ~63 nationally: the edge is eroding in real time.
  sources:
    - https://sports.yahoo.com/fantasy/article/fantasy-football-using-vacated-targets-to-identify-wrs-and-tes-who-should-see-an-increase-or-decrease-in-value-for-2026-144632341.html

- name: Kyle Pitts
  pos: TE
  category: situation
  thesis: >-
    New HC Kevin Stefanski's offenses produced a top-8 PPG PPR tight end in each of the
    last four seasons (Njoku x3, rookie Fannin 2025). Pitts was franchise-tagged then
    extended 3yr/$54M, cementing the role.
  kill: >-
    Semi-obvious: he is coming off his best season, and the streak uses per-game not
    total ranks. Play-calling in Cleveland was delegated to Rees, now ATL's OC.
  sources:
    - https://www.fantasylife.com/articles/fantasy/2026-nfl-coaching-changes-klint-kubiak-john-harbaugh-and-fantasy-football-impact-of-new-play-callers

- name: Harold Fannin
  pos: TE
  category: situation
  thesis: >-
    New HC Todd Monken's 2023-25 Baltimore offenses led the NFL in TE touchdowns (38, by
    a margin of 9) and ranked 2nd in TE PPR points, layered on Fannin's own TE8-in-PPG
    rookie season (72-731-6).
  kill: >-
    Volume check: Ravens TE targets ranked only 11th, so Monken's edge is TD/yardage
    efficiency, not raw volume. Rookie pedigree makes him semi-obvious already.
  sources:
    - https://www.fantasylife.com/articles/fantasy/2026-nfl-coaching-changes-klint-kubiak-john-harbaugh-and-fantasy-football-impact-of-new-play-callers
